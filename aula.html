<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula en Movimiento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .aula {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #ddd;
            margin: auto;
            border: 2px solid #333;
            overflow: hidden;
        }
        .persona {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #3498db;
            border-radius: 50%;
            animation: mover 5s infinite alternate ease-in-out;
        }
        .maestro {
            background-color: #e74c3c;
            left: 50%;
            animation-duration: 6s;
        }
        @keyframes mover {
            0% { top: 10px; left: 10px; }
            100% { top: 300px; left: 500px; }
        }
    </style>
</head>
<body>

    <h1>Aula con Alumnos y Maestros en Movimiento</h1>
    <div class="aula">
        <div class="persona"></div>
        <div class="persona"></div>
        <div class="persona"></div>
        <div class="maestro"></div>
    </div>

</body>
</html>
